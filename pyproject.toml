[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagster-anakin"
version = "0.1.0"
description = "Dagster resource and asset factory for Anakin: scrape, crawl, search, Wire site actions, website monitors and AI browser tasks"
license = { text = "Apache-2.0" }
authors = [{ name = "Anakin", email = "support@anakin.io" }]
keywords = ["dagster", "dagster-integration", "anakin", "web-scraping", "crawler", "web-data"]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "dagster>=1.8.0,<2.0.0",
    "anakin-sdk>=0.2.0,<0.3.0",
    # Only browser_task calls the API directly (POST /ai/evaluate isn't in
    # anakin-sdk yet); same floor anakin-sdk pins.
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://anakin.io"
Documentation = "https://anakin.io/docs/integrations/workflow/dagster"
Repository = "https://github.com/Anakin-Inc/dagster-anakin"
Issues = "https://github.com/Anakin-Inc/dagster-anakin/issues"
Changelog = "https://github.com/Anakin-Inc/dagster-anakin/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8.0.0,<9.0.0",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.10.0,<2.0.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["dagster_anakin"]
known-third-party = ["anakin"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"

[tool.mypy]
disallow_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["dagster_anakin"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github"]
