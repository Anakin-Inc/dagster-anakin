name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv
          uv pip install -e . --group test --group lint
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy dagster_anakin

  test:
    name: Dagster ${{ matrix.dagster }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dagster: "1.8.*", python: "3.10" }
          - { dagster: "1.*", python: "3.10" }
          - { dagster: "1.*", python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          uv venv
          uv pip install -e . --group test "dagster==${{ matrix.dagster }}"
      - run: uv run --no-sync pytest
      - name: Example definitions load
        run: uv run --no-sync dagster definitions validate -f examples/definitions.py

  build:
    name: Build and install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build --out-dir dist
      - run: uvx twine check --strict dist/*
      - name: Install the wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/python -c "
          import dagster_anakin
          assert sorted(dagster_anakin.__all__) == ['AnakinResource', '__version__', 'build_anakin_scrape_asset']
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
